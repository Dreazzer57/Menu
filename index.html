<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Plan Alimentaire — 4 semaines</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1020">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan Alim.">
<link rel="icon" href="icons/icon-192.png">
<style>
/* ==========================================================
   1. VARIABLES & RESET
   ========================================================== */
:root{
  --bg:#0b1020;            /* fond très sombre bleuté */
  --bg-soft:#111832;       /* fond des cartes */
  --bg-softer:#182142;     /* survol / éléments internes */
  --border:#232e55;
  --txt:#e8ecf8;
  --txt-dim:#98a3c7;
  --green:#3ddc84;         /* progression / validé */
  --green-dark:#123626;
  --blue:#5b9dff;          /* jours handball */
  --blue-dark:#12244a;
  --orange:#ffb454;        /* avertissements */
  --orange-dark:#3a2a10;
  --radius:16px;
  --shadow:0 8px 24px rgba(0,0,0,.45);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  background-image:radial-gradient(1000px 500px at 80% -10%,#16224a55,transparent),
                   radial-gradient(800px 400px at -10% 30%,#0f2b2455,transparent);
  color:var(--txt);
  font-family:var(--font);
  line-height:1.55;
  min-height:100vh;
  padding-bottom:80px;
}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* ==========================================================
   2. EN-TÊTE & NAVIGATION
   ========================================================== */
header{
  padding:28px 16px 8px;
  text-align:center;
}
header h1{
  font-size:clamp(1.5rem,4vw,2.3rem);
  font-weight:800;
  letter-spacing:-.5px;
}
header h1 span{color:var(--green)}
header p{color:var(--txt-dim);font-size:.95rem;margin-top:4px}

nav{
  position:sticky;top:0;z-index:50;
  display:flex;gap:8px;overflow-x:auto;
  padding:12px 16px;
  background:rgba(11,16,32,.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;
  background:var(--bg-soft);
  color:var(--txt-dim);
  border:1px solid var(--border);
  border-radius:999px;
  padding:8px 16px;
  font-size:.9rem;font-weight:600;
  transition:all .25s ease;
}
nav button:hover{color:var(--txt);border-color:var(--green)}
nav button.active{
  background:var(--green);color:#04120a;border-color:var(--green);
  box-shadow:0 0 18px #3ddc8455;
}

main{max-width:900px;margin:0 auto;padding:20px 16px}
.page{display:none;animation:fadeIn .35s ease}
.page.visible{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ==========================================================
   3. CARTES GÉNÉRIQUES
   ========================================================== */
.card{
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:16px;
}
.card h2{font-size:1.25rem;margin-bottom:12px}
.card h2 .dot{color:var(--green)}
.muted{color:var(--txt-dim);font-size:.9rem}

/* Grille de stats (accueil) */
.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-top:8px;
}
.stat{
  background:var(--bg-softer);
  border:1px solid var(--border);
  border-radius:12px;padding:14px;text-align:center;
  transition:transform .2s ease;
}
.stat:hover{transform:translateY(-3px)}
.stat b{display:block;font-size:1.5rem;color:var(--green)}
.stat.blue b{color:var(--blue)}
.stat small{color:var(--txt-dim)}

/* Avertissement */
.warn{
  background:var(--orange-dark);
  border:1px solid var(--orange);
  border-radius:12px;
  color:var(--orange);
  padding:12px 14px;font-size:.9rem;
  margin-top:12px;
  display:flex;gap:10px;align-items:flex-start;
}

/* Badge handball */
.badge-hb{
  display:inline-block;background:var(--blue-dark);color:var(--blue);
  border:1px solid var(--blue);border-radius:999px;
  font-size:.72rem;font-weight:700;padding:2px 10px;margin-left:8px;
  vertical-align:middle;
}

/* ==========================================================
   4. BARRES DE PROGRESSION
   ========================================================== */
.progress{
  background:var(--bg-softer);
  border-radius:999px;height:12px;overflow:hidden;
  border:1px solid var(--border);
}
.progress > div{
  height:100%;width:0%;
  background:linear-gradient(90deg,#1fae62,var(--green));
  border-radius:999px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
.progress-label{
  display:flex;justify-content:space-between;
  font-size:.82rem;color:var(--txt-dim);margin:10px 0 6px;
}
.celebrate{
  display:none;text-align:center;font-weight:700;
  color:var(--green);margin-top:10px;
  animation:pop .5s ease;
}
.celebrate.on{display:block}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

/* ==========================================================
   5. ACCORDÉON JOURS
   ========================================================== */
.day{
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:12px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:border-color .3s;
}
.day.handball{border-color:var(--blue)}
.day.done{border-color:var(--green)}
.day-head{
  width:100%;display:flex;align-items:center;gap:12px;
  background:transparent;border:none;color:var(--txt);
  padding:16px;text-align:left;
}
.day-head:hover{background:var(--bg-softer)}
.day-head .day-name{font-weight:700;font-size:1.05rem;flex:1}
.day-head .kcal{font-size:.8rem;color:var(--txt-dim);white-space:nowrap}
.day-head .chev{transition:transform .3s;color:var(--txt-dim)}
.day.open .chev{transform:rotate(180deg)}
.day-body{
  max-height:0;overflow:hidden;
  transition:max-height .45s ease;
  padding:0 14px;
}
.day.open .day-body{padding-bottom:14px}
.day .progress{height:8px;margin:0 16px 0}
.day .day-prog-wrap{padding:0 16px 14px}
.day-msg{font-size:.85rem;font-weight:700;color:var(--green);padding:0 16px 12px;display:none}
.day-msg.on{display:block;animation:pop .4s ease}

/* ==========================================================
   6. REPAS
   ========================================================== */
.meal{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--bg-softer);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;margin-top:10px;
  transition:background .3s,border-color .3s;
}
.meal.checked{
  background:var(--green-dark);
  border-color:var(--green);
}
.meal input[type=checkbox]{
  appearance:none;-webkit-appearance:none;
  width:22px;height:22px;flex:0 0 22px;margin-top:2px;
  border:2px solid var(--txt-dim);border-radius:7px;
  background:transparent;cursor:pointer;position:relative;
  transition:all .2s;
}
.meal input[type=checkbox]:checked{
  background:var(--green);border-color:var(--green);
}
.meal input[type=checkbox]:checked::after{
  content:"✓";position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:#04120a;font-weight:900;font-size:.9rem;
}
.meal-info{flex:1}
.meal-type{
  font-size:.72rem;text-transform:uppercase;letter-spacing:1px;
  color:var(--txt-dim);font-weight:700;
}
.meal.checked .meal-type{color:var(--green)}
.meal-name{font-weight:700;margin:2px 0 4px}
.meal ul{list-style:none;font-size:.86rem;color:var(--txt-dim)}
.meal ul li::before{content:"– "}
.meal-meta{
  display:flex;gap:12px;margin-top:6px;
  font-size:.78rem;color:var(--txt-dim);
}
.meal-meta span{background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:2px 10px}
.meal.checked .meal-meta span{border-color:var(--green);color:var(--green)}

/* Petit-déjeuner : deux versions côte à côte */
.pdj-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pdj-split > div{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px}
.pdj-split b{font-size:.86rem}
@media (max-width:600px){.pdj-split{grid-template-columns:1fr}}

/* ==========================================================
   7. LISTES DE COURSES & TABLEAUX
   ========================================================== */
.rayon h3{
  color:var(--green);font-size:.95rem;
  margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px;
}
.rayon ul{list-style:none}
.rayon li{
  padding:6px 0;border-bottom:1px dashed var(--border);
  font-size:.92rem;display:flex;justify-content:space-between;gap:10px;
}
.rayon li span:last-child{color:var(--txt-dim);white-space:nowrap}

table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--txt-dim);font-size:.78rem;text-transform:uppercase;letter-spacing:1px}
td input[type=number],td input[type=text]{
  width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;color:var(--txt);padding:8px;font-family:inherit;
}
td input:focus{border-color:var(--green);outline:none}

/* Batch cooking : étapes */
.step{
  display:flex;gap:14px;margin-top:14px;align-items:flex-start;
}
.step .num{
  flex:0 0 34px;height:34px;border-radius:50%;
  background:var(--green-dark);color:var(--green);
  border:1px solid var(--green);
  display:flex;align-items:center;justify-content:center;font-weight:800;
}
.step b{display:block}
.step small{color:var(--txt-dim)}

/* Boutons d'action (sauvegarde) */
.btn{
  background:var(--bg-softer);color:var(--txt);
  border:1px solid var(--border);border-radius:10px;
  padding:10px 16px;font-weight:600;font-size:.9rem;
  margin:6px 8px 0 0;transition:all .2s;
}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);color:#04120a;border-color:var(--green)}

/* ==========================================================
   8. RESPONSIVE & ACCESSIBILITÉ
   ========================================================== */
@media (max-width:600px){
  .card{padding:16px}
  .meal{flex-wrap:wrap}
  .day-head{padding:14px 12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <h1>Mon Plan <span>Alimentaire</span></h1>
  <p>4 semaines · simple · économique · 10 min par repas</p>
</header>

<nav id="nav"></nav>

<main id="main"></main>

<script>
/* ==========================================================
   DONNÉES — Base des repas
   Chaque ingrédient : [nom, quantité]
   ========================================================== */
const MEALS = {
  /* Petit-déjeuner : alterne entre 2 versions au fil de la semaine */
  pdj_avoine:{nom:"Avoine, petits suisses & muesli",ing:[["Café noir","1 tasse"],["Petits suisses","4"],["Flocons d'avoine","40 g"],["Muesli","20 g"]],kcal:410,tps:"3 min"},
  pdj_sale:{nom:"Pain complet, jambon, fromage frais & shake protéiné",ing:[["Pain complet","2 tranches"],["Jambon blanc","3 tranches"],["Fromage frais à tartiner","30 g"],["Protéine en poudre","1 dose (≈30 g), diluée dans de l'eau ou du lait"]],kcal:460,tps:"3 min"},

  /* --- Collations --- */
  col_pomme:{nom:"Pomme + amandes",ing:[["Pomme","1"],["Amandes","30 g"]],kcal:240,tps:"2 min"},
  /* Jours handball : collation renforcée avant la séance */
  col_hand:{nom:"Pré-handball (16 h)",ing:[["Banane","1"],["Flocons d'avoine","30 g"],["Beurre de cacahuète","25 g"]],kcal:350,tps:"3 min"},

  /* --- Déjeuners --- */
  l_poulet_riz:{nom:"Poulet, riz & brocolis",ing:[["Blanc de poulet","280 g"],["Riz (poids cru)","90 g"],["Brocolis","250 g"],["Huile d'olive","1 c. à s."]],kcal:790,tps:"10 min*"},
  l_pates_thon:{nom:"Pâtes complètes au thon",ing:[["Pâtes complètes (cru)","90 g"],["Thon en boîte","1 boîte 280 g"],["Sauce tomate","100 g"],["Oignon","½"]],kcal:770,tps:"10 min*"},
  l_steak_pdt:{nom:"Steak haché, pommes de terre & haricots verts",ing:[["Steak haché 5 %","280 g"],["Pommes de terre","300 g"],["Haricots verts","200 g"],["Beurre","1 noisette"]],kcal:780,tps:"10 min*"},
  l_dinde_lentilles:{nom:"Dinde aux lentilles & carottes",ing:[["Escalope de dinde","250 g"],["Lentilles (cru)","90 g"],["Carottes","200 g"],["Moutarde","1 c. à c."]],kcal:760,tps:"10 min*"},
  l_riz_dinde:{nom:"Dinde, riz & courgettes",ing:[["Escalope de dinde","280 g"],["Riz (cru)","90 g"],["Courgettes","250 g"],["Huile d'olive","1 c. à s."]],kcal:770,tps:"10 min*"},
  l_pates_poulet:{nom:"Pâtes complètes au poulet",ing:[["Pâtes complètes (cru)","90 g"],["Blanc de poulet","250 g"],["Courgettes","200 g"],["Sauce tomate","100 g"]],kcal:765,tps:"10 min*"},
  l_colin:{nom:"Colin, pommes de terre & carottes",ing:[["Colin surgelé","260 g"],["Pommes de terre","300 g"],["Carottes","150 g"],["Citron","½"]],kcal:690,tps:"10 min*"},
  l_salade_pdt:{nom:"Grande salade jambon, thon & pommes de terre",ing:[["Pommes de terre","200 g"],["Jambon blanc","3 tranches"],["Thon en boîte","1 boîte 100 g"],["Tomates","2"],["Concombre","½"],["Vinaigrette légère","1 c. à s."]],kcal:560,tps:"10 min"},
  l_saumon_riz:{nom:"Saumon, riz & brocolis",ing:[["Saumon","280 g"],["Riz (poids cru)","90 g"],["Brocolis","200 g"],["Citron & aneth","au goût"]],kcal:800,tps:"10 min*"},
  l_truite_pdt:{nom:"Truite, pommes de terre & haricots verts",ing:[["Truite","280 g"],["Pommes de terre","250 g"],["Haricots verts","200 g"],["Citron","½"]],kcal:740,tps:"10 min*"},
  l_plaisir:{nom:"🎉 Repas plaisir — libre !",ing:[["Ce qui te fait envie","burger, pizza, resto…"],["Astuce","évite juste les sodas sucrés"]],kcal:1000,tps:"—"},

  /* --- Dîners --- */
  d_salade_thon:{nom:"Salade de thon complète",ing:[["Thon en boîte","1 boîte 280 g"],["Pommes de terre","200 g"],["Tomates","2"],["Salade","2 poignées"],["Concombre","½"]],kcal:600,tps:"8 min"},
  d_jambon_puree:{nom:"Jambon, purée, haricots verts & shake protéiné",ing:[["Jambon blanc","4 tranches"],["Pommes de terre (purée)","250 g"],["Haricots verts","200 g"],["Protéine en poudre","1 dose (≈30 g), diluée dans de l'eau"]],kcal:565,tps:"10 min*"},
  d_poulet_courg:{nom:"Poulet & courgettes",ing:[["Blanc de poulet","250 g"],["Courgettes","250 g"],["Citron & herbes","au goût"]],kcal:530,tps:"10 min*"},
  d_dinde_carottes:{nom:"Dinde & carottes",ing:[["Escalope de dinde","250 g"],["Carottes","200 g"],["Citron & herbes","au goût"]],kcal:520,tps:"10 min*"},
  d_pates_jambon:{nom:"Pâtes complètes au jambon",ing:[["Pâtes complètes (cru)","70 g"],["Jambon blanc","4 tranches"],["Sauce tomate","100 g"],["Salade","1 poignée"]],kcal:500,tps:"10 min*"},
  d_riz_thon:{nom:"Riz au thon & tomates",ing:[["Riz (cru)","70 g"],["Thon en boîte","1 boîte 280 g"],["Tomates","2"],["Oignon","½"]],kcal:570,tps:"10 min*"},
  d_cabillaud_legumes:{nom:"Cabillaud, légumes & pommes de terre",ing:[["Cabillaud","260 g"],["Courgettes (ou haricots verts)","250 g"],["Pommes de terre","200 g"],["Citron","½"]],kcal:550,tps:"10 min*"},
  /* Soirs de handball : dîner léger, seulement si faim */
  dh_light:{nom:"Léger — shake protéiné, seulement si faim",ing:[["Protéine en poudre","1 dose (≈30 g), diluée dans de l'eau ou une boisson végétale"],["Optionnel","1 banane si grosse faim"]],kcal:150,tps:"2 min"},

  /* --- Dîners "spéciaux" du samedi : un peu plus élaborés, saveurs asiatiques --- */
  d_poulet_asia:{nom:"🥢 Poulet sauté soja-gingembre, riz & brocolis",ing:[["Blanc de poulet (émincé)","250 g"],["Riz (poids cru)","90 g"],["Brocolis (ou poivron)","200 g"],["Sauce soja","2 c. à s."],["Gingembre frais (ou en poudre) + ail","au goût"],["Huile de sésame","1 c. à c."]],kcal:720,tps:"20 min"},
  d_saumon_teriyaki:{nom:"🥢 Saumon teriyaki, riz & edamame",ing:[["Saumon","250 g"],["Riz (poids cru)","90 g"],["Edamame (ou brocolis)","150 g"],["Sauce soja","2 c. à s."],["Miel","1 c. à c."],["Ail","1 gousse"]],kcal:760,tps:"20 min"},
  d_boeuf_bobun:{nom:"🥢 Bo bun bœuf, nouilles de riz & crudités",ing:[["Bœuf (bavette ou steak)","220 g"],["Nouilles de riz","80 g"],["Carottes râpées","150 g"],["Concombre","½"],["Salade","1 poignée"],["Sauce nuoc-mam (nuoc-mam, citron vert, sucre, ail)","au goût"],["Cacahuètes concassées","1 c. à s."]],kcal:680,tps:"20 min"},
  d_curry_poulet_coco:{nom:"🥢 Curry de poulet léger au lait de coco & riz",ing:[["Blanc de poulet","250 g"],["Lait de coco allégé","150 ml"],["Curry en poudre","1 c. à s."],["Poivron (ou haricots verts)","200 g"],["Riz (poids cru)","90 g"]],kcal:790,tps:"20 min"}
};

/* ==========================================================
   DONNÉES — Structure des 4 semaines
   ========================================================== */
const JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const TYPES = ["Petit-déjeuner","Déjeuner","Collation","Dîner"];
function jour(dej,col,din){return ["pdj",dej,col,din];}

const WEEK_CONTENT = [
  /* ---- SEMAINE 1 — poisson : saumon (1x) ---- */
  [
    jour("l_poulet_riz","col_pomme","d_salade_thon"),
    jour("l_pates_thon","col_pomme","d_dinde_carottes"),
    jour("l_steak_pdt","col_pomme","d_poulet_courg"),
    jour("l_dinde_lentilles","col_pomme","d_riz_thon"),
    jour("l_saumon_riz","col_pomme","d_jambon_puree"),
    jour("l_plaisir","col_pomme","d_poulet_asia"),
    jour("l_salade_pdt","col_pomme","d_pates_jambon")
  ],
  /* ---- SEMAINE 2 — poisson : colin + cabillaud (2x) ---- */
  [
    jour("l_pates_poulet","col_pomme","d_riz_thon"),
    jour("l_colin","col_pomme","d_dinde_carottes"),
    jour("l_riz_dinde","col_pomme","d_poulet_courg"),
    jour("l_steak_pdt","col_pomme","d_jambon_puree"),
    jour("l_dinde_lentilles","col_pomme","d_cabillaud_legumes"),
    jour("l_plaisir","col_pomme","d_saumon_teriyaki"),
    jour("l_salade_pdt","col_pomme","d_pates_jambon")
  ],
  /* ---- SEMAINE 3 — poisson : truite (1x) ---- */
  [
    jour("l_riz_dinde","col_pomme","d_salade_thon"),
    jour("l_truite_pdt","col_pomme","d_poulet_courg"),
    jour("l_pates_poulet","col_pomme","d_dinde_carottes"),
    jour("l_pates_thon","col_pomme","d_riz_thon"),
    jour("l_poulet_riz","col_pomme","d_jambon_puree"),
    jour("l_plaisir","col_pomme","d_boeuf_bobun"),
    jour("l_salade_pdt","col_pomme","d_pates_jambon")
  ],
  /* ---- SEMAINE 4 — poisson : cabillaud + saumon (2x) ---- */
  [
    jour("l_steak_pdt","col_pomme","d_cabillaud_legumes"),
    jour("l_dinde_lentilles","col_pomme","d_dinde_carottes"),
    jour("l_pates_thon","col_pomme","d_poulet_courg"),
    jour("l_saumon_riz","col_pomme","d_jambon_puree"),
    jour("l_pates_poulet","col_pomme","d_salade_thon"),
    jour("l_plaisir","col_pomme","d_curry_poulet_coco"),
    jour("l_salade_pdt","col_pomme","d_riz_thon")
  ]
];
const HANDBALL = []; /* handball en pause (récupération post-méniscectomie) */

/* Petit-déjeuner alterné : avoine/muesli un jour sur deux, salé les autres jours */
const BREAKFAST_ROT = ["pdj_avoine","pdj_sale","pdj_avoine","pdj_sale","pdj_avoine","pdj_sale","pdj_avoine"];

/* ==========================================================
   ROTATIONS — 3 cycles de 4 semaines, à partir du même vivier
   de repas déjà équilibré. Chaque rotation réordonne les mêmes
   4 semaines et mélange les jours de semaine (lundi→vendredi),
   samedi (plaisir + plat asiatique) et dimanche (batch) restant
   des repères fixes. Change de rotation via le bouton dans
   l'onglet Accueil, sans avoir à redemander un nouveau plan.

const ROTATION_WEEK_ORDER = [ [0,1,2,3], [1,2,3,0], [2,3,0,1] ];

<script>
/* ==========================================================

const nav = document.getElementById("nav");
const main = document.getElementById("main");

const PAGES = [

  {id:"batch",label:"🍳 Batch cooking"},

/* Calories totales d'un jour (hors repas plaisir) */
function kcalJour(mealIds){
  return mealIds.reduce((t,id)=> id==="l_plaisir" ? t : t+MEALS[id].kcal, 0);
}

/* --- Page Accueil --- */

    <h2><span class="dot">●</span> Tes objectifs</h2>

      <div class="stat"><b>99 kg</b><small>→ objectif 85-90 kg</small></div>
      <div class="stat"><b>≈ 1 900-2 000</b><small>kcal / jour</small></div>
      <div class="stat"><b>≈ 120-140 g</b><small>protéines / jour</small></div>
      <div class="stat"><b>Dès lundi</b><small>Kiné 🦵 (post-méniscectomie)</small></div>
      <div class="stat"><b>≈ 58-61 €</b><small>Budget / semaine</small></div>
    </div>
    <div class="warn">⚠️ <span>Plan remonté en protéines (viande, poisson, un peu de whey) pour préserver le muscle pendant la perte de poids — les calories remontent un peu avec, c'est normal.</span></div>
  </section>
  <section class="card">
    <h2><span class="dot">●</span> Rotation de menus</h2>
    <p class="muted">Rotation <b>${state.rotation+1}/${NB_ROTATIONS}</b> en cours. Au bout de 4 semaines, change de rotation pour repartir sur un enchaînement différent des mêmes repas équilibrés — sans avoir à redemander un nouveau plan.</p>
    <button class="btn primary" data-rotate="1">🔄 Passer à la rotation suivante</button>
  </section>
  <section class="card">
    <h2><span class="dot">●</span> Comment ça marche</h2>
    <p class="muted">
      • <b>Petit-déjeuner</b> : alterne un jour sur deux entre avoine/muesli + petits suisses, et pain complet + jambon + fromage frais à tartiner + shake protéiné.<br>
      • <b>Poisson</b> : saumon, truite, colin ou cabillaud reviennent 1 à 2 fois par semaine pour varier les protéines.<br>
      • <b>Handball en pause</b> le temps de la récupération (méniscectomie) — repas normaux tous les jours.<br>
      • <b>Samedi midi</b> : repas plaisir 🎉 — totalement libre.<br>
      • <b>Samedi soir</b> : un plat un peu plus élaboré, saveurs asiatiques 🥢 — différent chaque semaine (poulet sauté, saumon teriyaki, bo bun, curry).<br>
      • <b>Dimanche</b> : batch cooking de ~45 min qui prépare presque toute la semaine (le poisson se cuisine à part, le jour même).<br>
      • Coche chaque repas terminé : il devient vert et tout est sauvegardé automatiquement.<br>
      • Les repas marqués <b>10 min*</b> se réchauffent en 10 min grâce au batch cooking.
    </p>
  </section>
  <section class="card">
    <h2>💾 Sauvegarde</h2>
    <p class="muted">Tes coches et ton suivi sont enregistrés automatiquement <b>sur cet appareil</b>. Pour partager ou sécuriser tes données : exporte le fichier de sauvegarde et importe-le sur un autre appareil (ou garde-le dans un cloud type Drive).</p>
    <button class="btn primary" id="btnExport">⬇️ Exporter la sauvegarde</button>
    <button class="btn" id="btnImport">⬆️ Importer une sauvegarde</button>

    <div class="progress"><div id="globalBar"></div></div>
  </section>`;
}

/* --- Un ingrédient --- */
function ingHTML(i){
  return `<li>${i[0]} — <b>${i[1]}</b></li>`;
}

/* --- Un repas --- */
function mealHTML(w,d,m,id){
  const meal = MEALS[id];
  const key = `s${w}d${d}m${m}`;
  const checked = state.checks[key] ? "checked" : "";
  const kc = id==="l_plaisir" ? "~1000" : meal.kcal;

  return `
  <div class="meal ${checked?'checked':''}" id="card-${key}">
    <input type="checkbox" data-key="${key}" data-w="${w}" data-d="${d}" ${checked}
           aria-label="Marquer ${TYPES[m]} comme terminé">
    <div class="meal-info">
      <div class="meal-type">${TYPES[m]}</div>
      <div class="meal-name">${meal.nom}</div>
      <ul>${meal.ing.map(ingHTML).join("")}</ul>
      <div class="meal-meta"><span>🔥 ${kc} kcal</span><span>⏱ ${meal.tps}</span></div>
    </div>
  </div>`;
}

/* --- Une semaine --- */
function pageSemaine(w){
  let html = `
  <section class="card">
    <h2><span class="dot">●</span> Semaine ${w+1}</h2>
    <div class="progress-label"><span>Progression de la semaine</span><span id="wpct-${w}">0 %</span></div>
    <div class="progress"><div id="wbar-${w}"></div></div>
    <div class="celebrate" id="wmsg-${w}">🏆 Semaine terminée !</div>
  </section>`;
  SEMAINES[w].forEach((meals,d)=>{
    const hb = HANDBALL.includes(d);
    const kj = kcalJour(meals);
    html += `
    <div class="day ${hb?'handball':''}" id="day-${w}-${d}">
      <button class="day-head" data-toggle="${w}-${d}" aria-expanded="false">
        <span class="day-name">${JOURS[d]}${hb?'<span class="badge-hb">🤾 Handball</span>':''}</span>
        <span class="kcal">≈${kj} kcal${meals.includes("l_plaisir")?" + 🎉":""}</span>
        <span class="chev">▼</span>
      </button>
      <div class="day-prog-wrap">
        <div class="progress"><div id="dbar-${w}-${d}"></div></div>
      </div>
      <div class="day-msg" id="dmsg-${w}-${d}">🎉 Journée terminée</div>
      <div class="day-body">
        ${meals.map((id,m)=>mealHTML(w,d,m,id)).join("")}
      </div>
    </div>`;
  });
  return html;
}

function pageCourses(){
  let html = `<section class="card"><h2><span class="dot">●</span> Listes de courses</h2>
  <p class="muted">Classées par rayons, recalculées pour toi à partir des repas réels de chaque semaine.</p></section>`;
  LISTES.forEach((liste,w)=>{
    html += `<section class="card"><h2>🛒 Semaine ${w+1}</h2>`;
    for(const [rayon,items] of Object.entries(liste)){
      html += `<div class="rayon"><h3>${rayon}</h3><ul>` +
        items.map(i=>`<li><span>${i[0]}</span><span>${i[1]}</span></li>`).join("") +
        `</ul></div>`;
    }
    html += `</section>`;
  });
  html += `<section class="card"><h2>💶 Budget estimé par semaine</h2>
    <ul class="rayon" style="list-style:none">` +
    BUDGET.map(b=>`<li style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border)"><span>${b[0]}</span><b>${b[1]}</b></li>`).join("") +
    `</ul>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><b>≈ 58-61 €</b><small>Total / semaine</small></div>
    </div>
    <div class="warn">⚠️ <span>Estimation en supermarché discount / marques distributeur. Le repas plaisir du samedi n'est pas compté.</span></div>
  </section>`;
  return html;
}

/* --- Batch cooking --- */
function pageBatch(){
  return `<section class="card">
    <h2>🍳 Batch cooking du dimanche <span class="muted">(~30-35 min)</span></h2>
    <p class="muted">Une seule session de cuisine prépare les féculents, viandes et légumes de la semaine. Ensuite, chaque repas = assembler + réchauffer en moins de 10 minutes.</p>
    ${BATCH.map((s,i)=>`
    <div class="step">
      <div class="num">${i+1}</div>
      <div><b>${s[0]}</b><span>${s[1]}</span><br><small>⏱ ${s[2]}</small></div>

}

/* --- Tableau de suivi --- */
function tableSuivi(qui,label,placeholder){
  let rows = "";

      <td><b>S${w+1}</b></td>
      <td><input type="number" step="0.1" min="0" placeholder="kg" data-suivi="poids" data-qui="${qui}" data-w="${w}" value="${s.poids??""}"></td>
      <td><input type="number" step="0.5" min="0" placeholder="cm" data-suivi="taille" data-qui="${qui}" data-w="${w}" value="${s.taille??""}"></td>
      <td><input type="text" placeholder="${placeholder}" data-suivi="note" data-qui="${qui}" data-w="${w}" value="${s.note??""}"></td>
    </tr>`;
  }
  return `<h2 style="margin-top:8px">${label}</h2>
    <div style="overflow-x:auto"><table>
      <thead><tr><th></th><th>Poids (kg)</th><th>Tour de taille (cm)</th><th>Remarques</th></tr></thead>
      <tbody>${rows}</tbody>

}
function pageSuivi(){
  return `<section class="card">
    <h2>📈 Tableau de suivi</h2>

   ========================================================== */

  if(i===0) b.classList.add("active");
  nav.appendChild(b);

  const sec = document.createElement("div");
  sec.className = "page" + (i===0?" visible":"");
  sec.id = "page-" + p.id;
  main.appendChild(sec);
});

document.getElementById("page-accueil").innerHTML = pageAccueil();
for(let w=0; w<4; w++) document.getElementById("page-s"+w).innerHTML = pageSemaine(w);
document.getElementById("page-courses").innerHTML = pageCourses();

document.getElementById("page-suivi").innerHTML = pageSuivi();

/* ==========================================================

   ========================================================== */

/* Navigation entre onglets */
nav.addEventListener("click",e=>{
  const btn = e.target.closest("button");
  if(!btn) return;
  nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b===btn));
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("visible"));
  document.getElementById("page-"+btn.dataset.page).classList.add("visible");
  window.scrollTo({top:0});
});

/* Changer de rotation de menus */
main.addEventListener("click",e=>{
  const btn = e.target.closest("[data-rotate]");
  if(!btn) return;
  const ok = confirm("Passer à la rotation suivante ? Tes coches de progression seront réinitialisées (ton suivi de poids est conservé).");
  if(!ok) return;
  state.rotation = (state.rotation+1) % NB_ROTATIONS;
  state.checks = {};
  save();
  SEMAINES = buildSemaines(state.rotation);
  LISTES = buildListes(state.rotation);
  document.getElementById("page-accueil").innerHTML = pageAccueil();
  for(let w=0; w<4; w++) document.getElementById("page-s"+w).innerHTML = pageSemaine(w);
  document.getElementById("page-courses").innerHTML = pageCourses();
  for(let w=0;w<4;w++) for(let d=0;d<7;d++) refresh(w,d);
  window.scrollTo({top:0});
});

/* Accordéon des jours */
main.addEventListener("click",e=>{
  const head = e.target.closest("[data-toggle]");
  if(!head) return;
  const day = head.parentElement;
  const body = day.querySelector(".day-body");
  const open = day.classList.toggle("open");
  head.setAttribute("aria-expanded", open);
  body.style.maxHeight = open ? body.scrollHeight + "px" : "0";
});

/* Cases à cocher des repas + champs du suivi */
main.addEventListener("change",e=>{
  const el = e.target;
  if(el.matches("input[type=checkbox][data-key]")){
    const key = el.dataset.key;
    if(el.checked) state.checks[key] = true;
    else delete state.checks[key];
    document.getElementById("card-"+key).classList.toggle("checked", el.checked);
    save();
    refresh(+el.dataset.w, +el.dataset.d);
    const body = el.closest(".day-body");
    if(body && body.parentElement.classList.contains("open"))
      body.style.maxHeight = body.scrollHeight + "px";
  }
  if(el.matches("[data-suivi]")){
    majChampSuivi(el);
    majSuivi();
  }
});
/* Sauvegarde aussi pendant la frappe dans le suivi */
main.addEventListener("input",e=>{
  if(e.target.matches("[data-suivi]")) majChampSuivi(e.target);
});
function majChampSuivi(el){
  const qui = el.dataset.qui, w = +el.dataset.w;
  state.suivi[qui][w] = state.suivi[qui][w] || {};
  state.suivi[qui][w][el.dataset.suivi] = el.value;
  save();
}

/* ==========================================================
   PROGRESSION — jour, semaine, global
   ========================================================== */
function compteJour(w,d){
  let done = 0;
  for(let m=0;m<4;m++) if(state.checks[`s${w}d${d}m${m}`]) done++;
  return done;
}
function refresh(w,d){
  const dj = compteJour(w,d);
  document.getElementById(`dbar-${w}-${d}`).style.width = (dj/4*100)+"%";
  document.getElementById(`dmsg-${w}-${d}`).classList.toggle("on", dj===4);
  document.getElementById(`day-${w}-${d}`).classList.toggle("done", dj===4);

  let ws = 0;
  for(let j=0;j<7;j++) ws += compteJour(w,j);
  const wpct = Math.round(ws/28*100);
  document.getElementById(`wbar-${w}`).style.width = wpct+"%";
  document.getElementById(`wpct-${w}`).textContent = wpct+" %";
  document.getElementById(`wmsg-${w}`).classList.toggle("on", ws===28);

  const total = Object.keys(state.checks).length;
  const gpct = Math.round(total/112*100);
  document.getElementById("globalBar").style.width = gpct+"%";
  document.getElementById("globalPct").textContent = gpct+" %";
}

/* Statistiques du suivi (perte pour chacun) */
function statPerte(qui,depart,objectif,emoji){
  const poids = state.suivi[qui].map(s=>parseFloat(s&&s.poids)).filter(v=>!isNaN(v));
  if(!poids.length) return `<div class="stat"><b>${emoji} —</b><small>Note un poids pour voir tes stats</small></div>`;
  const dernier = poids[poids.length-1];
  const perte = depart - dernier;
  return `
    <div class="stat"><b>${emoji} ${dernier} kg</b><small>Dernier poids noté</small></div>
    <div class="stat"><b>${perte>=0?"-":"+"}${Math.abs(perte).toFixed(1)} kg</b><small>Depuis le départ (${depart} kg)</small></div>
    <div class="stat"><b>${Math.max(0,dernier-objectif).toFixed(1)} kg</b><small>Restants vers ${objectif} kg</small></div>`;
}
function majSuivi(){
  document.getElementById("suiviStats").innerHTML =
    statPerte("a",105,87.5,"⚖️");
}

/* ==========================================================
   SAUVEGARDE — export / import du fichier JSON
   ========================================================== */
document.getElementById("btnExport").addEventListener("click",()=>{
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const d = new Date().toISOString().slice(0,10);
  a.download = `plan-alimentaire-sauvegarde-${d}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("btnImport").addEventListener("click",()=>{
  document.getElementById("fileImport").click();
});
document.getElementById("fileImport").addEventListener("change",e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!data.checks && !data.suivi) throw new Error("format");
      state = Object.assign({checks:{},suivi:{a:[{},{},{},{}],b:[{},{},{},{}]},rotation:0}, data);
      save();
      location.reload(); /* recharge la page avec les données importées */
    }catch(err){
      alert("Fichier de sauvegarde invalide.");
    }
  };
  r.readAsText(f);
});

/* Initialisation : appliquer l'état sauvegardé */
for(let w=0;w<4;w++) for(let d=0;d<7;d++) refresh(w,d);
majSuivi();
</script>
<script>
/* Enregistrement du service worker : rend le site installable et utilisable hors connexion */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(err=>console.warn("SW non enregistré :", err));
  });
}
</script>
